[package]
name = "grimoire"
version = "0.3.0"
description = "Grimoire : concoctez vos guides de succès Steam jusqu’au 100 %"
license = "GPL-3.0-only"
edition = "2021"
rust-version = "1.89"

[lib]
# Le suffixe _lib évite un conflit de nom avec le binaire sous Windows
name = "grimoire_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyvalues-parser = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip"] }
rusqlite = { version = "0.42", features = ["bundled", "backup"] }
tauri-plugin-opener = "2"
# Boîtes de dialogue du démarrage (recovery.rs), avant que la boucle d'événements tourne ; déjà
# utilisé par tauri-plugin-dialog (licence MIT)
rfd = { version = "0.17", default-features = false, features = ["common-controls-v6"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
base64 = "0.22"
tauri-plugin-updater = "2"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
