# Types Svelte / TypeScript et tests Rust à chaque envoi sur main et pour chaque demande de fusion.
name: Vérifications

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verifications:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run check
      - run: cargo test --lib
        working-directory: src-tauri
